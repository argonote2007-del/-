<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HP 계산기</title><link rel="manifest" href="./manifest.json"><meta name="theme-color" content="#101521"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><link rel="apple-touch-icon" href="./icon-192.png"><style>
:root{font-family:system-ui,sans-serif;color-scheme:dark;background:#101521;color:#f4f6fa}*{box-sizing:border-box}body{margin:0 auto;padding:16px;max-width:1250px}h1{font-size:23px;margin:0}p,.muted{color:#afbdd1;font-size:12px}button,input{font:inherit;border:1px solid #47576d;border-radius:8px;padding:9px}button{background:#29394f;color:white;cursor:pointer}button:hover{background:#3b506c}button:disabled{opacity:.4;cursor:not-allowed}input{background:#131f30;color:white;width:100%;min-width:0}.primary{background:#246ac3}.danger{background:#923b4b}.toolbar,.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.tile{background:#1b283a;border:1px solid #40516a;border-radius:12px;padding:10px;min-width:0}.tile.active{outline:2px solid #68a7ff}.tile.selected{background:#263d4a}.tilehead{display:flex;align-items:center;gap:6px}.tilehead button{padding:3px 6px;font-size:11px}.tilehead .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left;background:transparent;border:0;padding:3px;font-weight:750}.tilehead input{width:18px;height:18px;flex:none;accent-color:#57a5ff}.hp{font-size:19px;font-weight:800;margin-top:7px}.shield{color:#78c6ff;font-size:12px}.barrier{color:#edcb75;font-size:12px;font-weight:700}.bar{height:6px;border-radius:8px;background:#56313a;overflow:hidden;margin-top:7px}.fill{height:100%;background:#45c889}.panel{background:#1b283a;border:1px solid #435671;border-radius:12px;padding:15px;margin:13px 0}.panel h2{font-size:18px;margin:0 0 12px}.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}.fields label{display:grid;gap:4px;font-size:12px;color:#bac6d8}.actions button{flex:1;min-width:110px}.hidden{display:none}.group{border-color:#587caa}.group input[type=number]{max-width:200px}.pill{font-size:12px;color:#e4cb85}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.hp{font-size:17px}body{padding:11px}}
</style></head><body><h1>⚔️ HP</h1><div class="toolbar"><button class="primary" id="add">+ 추가</button><button id="all">전체</button><button id="none">해제</button><button id="export">백업</button><button id="import">불러오기</button><input hidden type="file" id="file" accept=".json,application/json"></div>
<section class="panel group"><h2>일괄 <span class="muted" id="count">0명</span></h2><input id="bulkAmount" type="number" min="0" step="1" placeholder="수치" aria-label="일괄 적용 수치"><div class="actions"><button class="danger" id="bulkDamage">피해</button><button id="bulkHeal">회복</button><button id="bulkShield">쉴드 +</button><button id="bulkBarrier">베리어 +</button><button id="bulkClearBarrier">베리어 −</button></div></section>
<main id="grid" class="grid"></main><section id="panel" class="panel hidden"></section>
<script>
const key='offline-hp-calculator-v3',oldKey='offline-hp-calculator-v1';let chars;try{chars=JSON.parse(localStorage.getItem(key));if(!Array.isArray(chars))chars=JSON.parse(localStorage.getItem(oldKey))}catch{}if(!Array.isArray(chars))chars=[];if(!chars.length)chars=[{id:1,name:'캐릭터 1',hp:100,max:100}];const n=x=>Number.isFinite(Number(x))?Math.max(0,Math.floor(Number(x))):0;chars=chars.map((c,i)=>({id:i+1,name:String(c.name??'캐릭터'),max:Math.max(1,n(c.max)),hp:Math.min(n(c.hp),Math.max(1,n(c.max))),shield:n(c.shield),barrier:!!c.barrier}));let nextId=chars.length+1,selected=null;const checked=new Set(),grid=document.getElementById('grid'),panel=document.getElementById('panel');function save(){try{localStorage.setItem(key,JSON.stringify(chars))}catch(e){console.warn(e)}}function node(tag,cls,text){const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x}function damage(c,v){if(v<=0)return;if(c.barrier){c.barrier=false;return}let rem=v;if(c.shield){const absorbed=Math.min(rem,c.shield);c.shield-=absorbed;rem-=absorbed}c.hp=Math.max(0,c.hp-rem)}function heal(c,v){c.hp=Math.min(c.max,c.hp+v)}function render(){grid.replaceChildren();document.getElementById('count').textContent=checked.size+'명';chars.forEach(c=>{const tile=node('div','tile'+(selected===c.id?' active':'')+(checked.has(c.id)?' selected':'')),head=node('div','tilehead'),check=node('input');check.type='checkbox';check.checked=checked.has(c.id);check.setAttribute('aria-label',c.name+' 일괄 선택');check.onchange=()=>{check.checked?checked.add(c.id):checked.delete(c.id);render()};const name=node('button','name',c.name||'이름 없음');name.onclick=()=>{selected=selected===c.id?null:c.id;render()};head.append(check,name);tile.append(head,node('div','hp',c.hp+' / '+c.max),node('div','shield','🛡 '+c.shield),node('div','barrier',c.barrier?'✦ 베리어':'베리어 −'));const bar=node('div','bar'),fill=node('div','fill');fill.style.width=(c.hp/c.max*100)+'%';bar.append(fill);tile.append(bar);grid.append(tile)});renderPanel()}
function renderPanel(){panel.replaceChildren();const c=chars.find(x=>x.id===selected);if(!c){panel.classList.add('hidden');return}panel.classList.remove('hidden');panel.append(node('h2','',c.name+''));const fields=node('div','fields');function field(label,value,type='number'){const l=node('label','',label),i=node('input');i.type=type;i.value=value;if(type==='number'){i.min=label==='최대'?'1':'0';i.step='1'}l.append(i);fields.append(l);return i}const name=field('이름',c.name,'text'),max=field('최대',c.max),current=field('현재',c.hp),shield=field('쉴드',c.shield),amount=field('수치','');amount.placeholder='입력';panel.append(fields);name.onchange=()=>{c.name=name.value;save();render()};max.onchange=()=>{c.max=Math.max(1,n(max.value));c.hp=Math.min(c.hp,c.max);save();render()};current.onchange=()=>{c.hp=Math.min(c.max,n(current.value));save();render()};shield.onchange=()=>{c.shield=n(shield.value);save();render()};const actions=node('div','actions');function action(label,fn,cls){const b=node('button',cls||'',label);b.onclick=()=>{fn();save();render()};actions.append(b)}action('− 데미지',()=>damage(c,n(amount.value)),'danger');action('+ HP 회복',()=>heal(c,n(amount.value)));action('+ 쉴드',()=>c.shield+=n(amount.value));action('베리어 +',()=>c.barrier=true);action('베리어 −',()=>c.barrier=false);action('전체 회복',()=>c.hp=c.max);action('HP 0',()=>c.hp=0);action('삭제',()=>{if(confirm('캐릭터를 삭제할까요?')){chars=chars.filter(x=>x.id!==c.id);checked.delete(c.id);selected=null}},'danger');action('닫기',()=>selected=null);panel.append(actions)}
function bulk(fn,needAmount=true){const targets=chars.filter(c=>checked.has(c.id));if(!targets.length){alert('먼저 캐릭터를 선택하세요.');return}const v=n(document.getElementById('bulkAmount').value);if(needAmount&&v===0){alert('0보다 큰 수치를 입력하세요.');return}targets.forEach(c=>fn(c,v));save();render()}document.getElementById('bulkDamage').onclick=()=>bulk(damage);document.getElementById('bulkHeal').onclick=()=>bulk(heal);document.getElementById('bulkShield').onclick=()=>bulk((c,v)=>c.shield+=v);document.getElementById('bulkBarrier').onclick=()=>bulk(c=>c.barrier=true,false);document.getElementById('bulkClearBarrier').onclick=()=>bulk(c=>c.barrier=false,false);document.getElementById('all').onclick=()=>{chars.forEach(c=>checked.add(c.id));render()};document.getElementById('none').onclick=()=>{checked.clear();render()};document.getElementById('add').onclick=()=>{const c={id:nextId++,name:'새 캐릭터',hp:100,max:100,shield:0,barrier:false};chars.push(c);selected=c.id;save();render()};document.getElementById('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(chars,null,2)],{type:'application/json'})),a=node('a');a.href=url;a.download='hp-backup-v3.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};document.getElementById('import').onclick=()=>document.getElementById('file').click();document.getElementById('file').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{const data=JSON.parse(await f.text());if(!Array.isArray(data)||!data.every(c=>typeof c.name==='string'&&Number.isFinite(c.hp)&&Number.isFinite(c.max)&&c.max>=1&&c.hp>=0&&(!('shield'in c)||(Number.isFinite(c.shield)&&c.shield>=0))))throw Error();if(confirm('현재 캐릭터 데이터를 교체할까요?')){chars=data.map((c,i)=>({id:i+1,name:c.name,max:Math.max(1,n(c.max)),hp:Math.min(n(c.hp),Math.max(1,n(c.max))),shield:n(c.shield),barrier:!!c.barrier}));nextId=chars.length+1;selected=null;checked.clear();save();render()}}catch{alert('올바른 백업 파일이 아닙니다.')}e.target.value=''};save();render();
</script><script>if ('serviceWorker' in navigator) window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));</script></body></html>
